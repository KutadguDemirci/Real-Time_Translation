# Project metadata and dependency groups for the eventual installable cross-platform app.
# Keep model/runtime versions pinned after the selected wheels and model files are verified on macOS and Windows.
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-realtime-translation"
version = "0.1.0"
description = "Local French-English microphone translation with speech output"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "Pillow>=10"]

[project.optional-dependencies]
# Piper is GPL-3.0-or-later; verify distribution obligations and each voice's separate license.
desktop = []
audio = ["numpy>=1.26", "sounddevice>=0.4.6"]
inference = ["numpy>=1.26", "sherpa-onnx>=1.10,<2"]
qwen-asr = ["torch>=2.2", "qwen-asr>=0.0.6,<0.1"]
# Qwen's official incremental API is vLLM-backed; keep that larger Linux runtime opt-in.
qwen-asr-streaming = ["torch>=2.2", "qwen-asr[vllm]>=0.0.6,<0.1; sys_platform == 'linux'"]
tts = ["piper-tts>=1.8,<2"]
translation = ["torch>=2.2", "transformers>=4.41,<5", "sentencepiece>=0.2"]
dev = ["ruff", "mypy"]

[project.scripts]
# Entry point implemented in src/real_time_translation/app.py.
local-translator = "real_time_translation.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

