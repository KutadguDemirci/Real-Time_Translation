# Project metadata and dependency groups for the installable desktop app.
# Runtime versions are pinned together for the local ASR, translation, and MLX TTS stack.
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-realtime-translation"
version = "0.1.0"
description = "Local multilingual microphone translation with speech output"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "Pillow>=10"]

[project.optional-dependencies]
audio = ["numpy>=1.26", "sounddevice>=0.4.6"]
inference = ["numpy>=1.26", "sherpa-onnx>=1.10,<2"]
qwen-asr = ["torch==2.6.0", "transformers==4.57.6", "qwen-asr>=0.0.6,<0.1"]
# Qwen's official incremental API is vLLM-backed; keep that larger Linux runtime opt-in.
qwen-asr-streaming = ["torch==2.6.0", "transformers==4.57.6", "qwen-asr[vllm]>=0.0.6,<0.1; sys_platform == 'linux'"]
tts = [
    "mlx==0.32.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "miniaudio>=1.61; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "transformers==4.57.6",
    "huggingface_hub==0.36.2",
    "safetensors==0.5.3",
]
translation = ["torch==2.6.0", "transformers==4.57.6", "sentencepiece>=0.2", "huggingface_hub==0.36.2"]
dev = ["ruff", "mypy"]

[project.scripts]
# Entry point implemented in src/real_time_translation/app.py.
local-translator = "real_time_translation.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
real_time_translation = ["assets/*.wav"]

[tool.ruff]
line-length = 100
target-version = "py311"

